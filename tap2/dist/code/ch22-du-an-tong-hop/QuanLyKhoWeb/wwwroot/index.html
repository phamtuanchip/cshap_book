<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý kho</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 1rem auto; padding: 0 1rem; color: #222; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { padding: .4rem .6rem; border-bottom: 1px solid #ddd; text-align: left; }
    .so { text-align: right; } .het { color: #b00020; font-weight: 600; }
    input, button { padding: .35rem .6rem; margin: .15rem; } button { cursor: pointer; }
    #thongbao { padding: .5rem 1rem; border-radius: 4px; margin: .5rem 0; } .ok { background: #e6f7e6; } .loi { background: #fde8e8; }
    .an { display: none; }
  </style>
</head>
<body>
  <h1>Quản lý kho</h1>

  <form id="dangnhap">
    <input id="ten" placeholder="Tên đăng nhập" value="nhanvien" autocomplete="username">
    <input id="mk" type="password" placeholder="Mật khẩu" value="NhanVien@123" autocomplete="current-password">
    <button>Đăng nhập</button>
  </form>

  <div id="thongbao" class="an"></div>

  <section id="noidung" class="an">
    <p>Xin chào <strong id="ai"></strong> <button id="thoat">Đăng xuất</button></p>
    <h2>Sản phẩm</h2>
    <input id="tim" placeholder="Tìm…">
    <table><thead><tr><th>Mã</th><th>Tên</th><th>Nhóm</th><th class="so">Đơn giá</th><th class="so">Tồn</th><th></th></tr></thead><tbody id="ds"></tbody></table>
    <h2>Sắp hết hàng</h2>
    <ul id="saphet"></ul>
  </section>

  <script>
    // Token luu trong BO NHO (mat khi tai lai trang): don gian va an toan hon localStorage cho demo. Ung dung that: cookie HttpOnly hoac OIDC.
    let token = null;
    const $ = id => document.getElementById(id);
    const fmt = n => Number(n).toLocaleString('vi-VN');

    function thongBao(noiDung, ok = true) {
      const e = $('thongbao'); e.textContent = noiDung; e.className = ok ? 'ok' : 'loi';
      setTimeout(() => e.className = 'an', 4000);
    }

    async function goi(url, opt = {}) {
      const res = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }), ...opt.headers } });
      if (res.status === 401) { thongBao('Chưa đăng nhập hoặc phiên hết hạn', false); return null; }
      const body = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
      if (!res.ok) { thongBao(body?.detail || body?.title || ('Lỗi ' + res.status), false); return null; }
      return body;
    }

    async function taiLai() {
      const kq = await goi('/api/san-pham?kichThuoc=50&tim=' + encodeURIComponent($('tim').value));
      if (!kq) return;
      $('ds').innerHTML = kq.muc.map(s => `
        <tr><td>${esc(s.ma)}</td><td>${esc(s.ten)}</td><td>${esc(s.nhom)}</td><td class="so">${fmt(s.donGia)}</td>
        <td class="so ${s.sapHet ? 'het' : ''}">${s.tonKho}</td>
        <td><button data-id="${s.id}" data-act="nhap">+ Nhập</button><button data-id="${s.id}" data-act="xuat">− Xuất</button></td></tr>`).join('');
      const sh = await goi('/api/bao-cao/sap-het');
      $('saphet').innerHTML = (sh ?? []).map(s => `<li>${esc(s.ma)} – ${esc(s.ten)}: còn <strong>${s.tonKho}</strong></li>`).join('');
    }

    // Luon ma hoa du lieu truoc khi chen vao HTML (Chuong 21 - XSS)
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    $('dangnhap').addEventListener('submit', async e => {
      e.preventDefault();
      const kq = await goi('/api/dang-nhap', { method: 'POST', body: JSON.stringify({ tenDangNhap: $('ten').value, matKhau: $('mk').value }) });
      if (!kq) return;
      token = kq.accessToken; $('ai').textContent = $('ten').value; $('noidung').className = ''; $('dangnhap').className = 'an';
      taiLai();
    });
    $('thoat').onclick = () => { token = null; $('noidung').className = 'an'; $('dangnhap').className = ''; };
    $('tim').oninput = () => taiLai();
    $('ds').addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      const so = parseInt(prompt(b.dataset.act === 'nhap' ? 'Số lượng nhập?' : 'Số lượng xuất?', '1'), 10);
      if (!so) return;
      const kq = await goi(`/api/san-pham/${b.dataset.id}/${b.dataset.act}`, { method: 'POST', body: JSON.stringify({ soLuong: so }) });
      if (kq) { thongBao(`Đã ${b.dataset.act === 'nhap' ? 'nhập' : 'xuất'} ${so} — tồn mới ${kq.tonKho}`); taiLai(); }
    });
  </script>
</body>
</html>
