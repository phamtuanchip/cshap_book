# Xuat ban sach (HTML + PDF da build san trong cac thu muc dist/) len GitHub Pages
name: pages

on:
  push:
    branches: [main]
    paths: ["dist/**", "tap2/dist/**", "tap3/dist/**", "tap4/dist/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gom cac tap vao _site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -r dist _site/tap1
          cp -r tap2/dist _site/tap2
          cp -r tap3/dist _site/tap3
          cp -r tap4/dist _site/tap4
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
